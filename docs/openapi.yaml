openapi: 3.0.3
info:
  title: EduBridge API
  version: 0.1.0-skeleton
  description: Phase 0 skeleton. Full Zod-derived schemas arrive in Phase 1+.
servers:
  - url: /api/v1
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: eb_session }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string }, details: {} }
    Lang: { type: string, enum: [uz, ru, en] }
paths:
  /health: { get: { summary: Liveness, responses: { '200': { description: ok } } } }
  /ready: { get: { summary: DB + migrations ready, responses: { '200': { description: ready }, '503': { description: not ready } } } }
  /auth/telegram: { post: { summary: Verify Telegram Login payload, responses: { '200': { description: session cookie set }, '401': { description: invalid or expired } } } }
  /auth/google/start: { get: { summary: Begin OIDC (state+PKCE), responses: { '302': { description: redirect } } } }
  /auth/google/callback: { get: { summary: OIDC callback, responses: { '302': { description: redirect + session } } } }
  /auth/session: { get: { summary: 'Start-up check: 200 with user null for guests', responses: { '200': { description: ok } } } }
  /auth/link/telegram: { post: { security: [{ session: [] }], summary: Link a Telegram account (409 if it belongs to another user), responses: { '200': { description: linked }, '409': { description: identity_taken } } } }
  /auth/dev-login: { post: { summary: 'Development only (404 unless ALLOW_DEV_LOGIN)', responses: { '200': { description: session cookie set } } } }
  /me/identities/{provider}: { delete: { security: [{ session: [] }], summary: Remove a sign-in method (not the last one), parameters: [{ name: provider, in: path, required: true, schema: { type: string, enum: [telegram, google] } }], responses: { '204': { description: removed }, '409': { description: last_identity } } } }
  /me/sessions/{id}: { delete: { security: [{ session: [] }], summary: Revoke one of my sessions, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '204': { description: revoked }, '404': { description: not mine } } } }
  /auth/logout: { post: { security: [{ session: [] }], summary: Revoke session, responses: { '204': { description: ok } } } }
  /me:
    get: { security: [{ session: [] }], summary: Current user, responses: { '200': { description: user }, '401': { description: unauthenticated } } }
    patch: { security: [{ session: [] }], summary: Update lang/display name, responses: { '200': { description: user } } }
    delete: { security: [{ session: [] }], summary: Hard-delete account and all data, responses: { '204': { description: deleted } } }
  /me/sessions: { get: { security: [{ session: [] }], summary: List sessions, responses: { '200': { description: list } } } }
  /me/import-local: { post: { security: [{ session: [] }], summary: Import edubridge:v1 localStorage object, responses: { '200': { description: import report } } } }
  /me/export: { get: { security: [{ session: [] }], summary: Export all user data as JSON, responses: { '200': { description: file } } } }
  /me/calendar-feed: { post: { security: [{ session: [] }], summary: Create or rotate signed feed token, responses: { '200': { description: feed url } } } }
  /me/profile: &resource
    get: { security: [{ session: [] }], summary: Get, responses: { '200': { description: ok }, '404': { description: none } } }
    put: { security: [{ session: [] }], summary: Replace (If-Match version), responses: { '200': { description: ok }, '409': { description: stale version, returns server copy } } }
    delete: { security: [{ session: [] }], summary: Delete, responses: { '204': { description: ok } } }
  # Same shape for: /me/applications, /me/documents, /me/chats, /me/interviews,
  # /me/growth, /me/budgets, /me/events, /me/saved, /me/settings (+ /{id} for collections)
  # AI tasks for /ai/json: cv, letter, audit, improve, interview_questions, interview_feedback, consistency, growth_ideas, activity_review
  /ai/health: { get: { summary: AI availability and caller quota, responses: { '200': { description: ok } } } }
  /ai/chat: { post: { security: [{ session: [] }], summary: Grounded chat (SSE), responses: { '200': { description: text/event-stream }, '429': { description: rate_limited or quota_exceeded }, '503': { description: ai_disabled } } } }
  /ai/json: { post: { security: [{ session: [] }], summary: Task-typed structured AI call (cv, letter, audit, improve, interview, consistency, growth), responses: { '200': { description: validated result + flags }, '502': { description: ai_bad_reply }, '429': { description: limited } } } }
  /ai/ocr: { post: { security: [{ session: [] }], summary: Scanned page images to text, responses: { '200': { description: pages with legibility } } } }
  /catalog/version: { get: { summary: Published catalogue version, responses: { '200': { description: ok } } } }
  /catalog/countries: { get: { summary: List, responses: { '200': { description: ok } } } }
  /catalog/countries/{code}: { get: { summary: One country, parameters: [{ name: code, in: path, required: true, schema: { type: string, enum: [MY, HU, DE, TR, KR] } }], responses: { '200': { description: ok } } } }
  /catalog/universities: { get: { summary: Search and filter (q, country, tier, level, subject, language, funding, confirmedDeadline, confirmedFee, ielts), responses: { '200': { description: ok } } } }
  /catalog/universities/{id}: { get: { summary: One university, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok }, '404': { description: unknown } } } }
  /catalog/grants: { get: { summary: List grants, responses: { '200': { description: ok } } } }
  /catalog/grants/{id}: { get: { summary: One grant, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } } }
  /catalog/compare: { get: { summary: "Compare 2-3 universities (ids, level)", responses: { '200': { description: ok } } } }
  /admin/me: { get: { security: [{ session: [] }], summary: "Role and when a new sign-in is needed (editor, admin)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old } } } }
  /admin/entities: { get: { security: [{ session: [] }], summary: "List universities or grants including hidden ones (editor, admin)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old } } } }
  /admin/entities/{type}/{id}: { get: { security: [{ session: [] }], summary: "One record with marks, revisions, sources (editor, admin)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old } } } }
  /admin/entities/{type}/{id}/reviewed: { post: { security: [{ session: [] }], summary: "Set or clear the Reviewed mark (editor, admin)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old } } } }
  /admin/entities/{type}/{id}/hide: { post: { security: [{ session: [] }], summary: "Hide or unhide from students; reason required; bumps the catalogue version (admin)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old } } } }
  /admin/revisions: { get: { security: [{ session: [] }], summary: "Revision queue (editor, admin)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old } } }, post: { security: [{ session: [] }], summary: "Start a draft from the published record; one open draft per record (editor, admin)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old }, '409': { description: draft already open } } } }
  /admin/revisions/{id}: { get: { security: [{ session: [] }], summary: "Draft, published record, field changes, rule issues, stale flag (editor, admin)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old } } }, put: { security: [{ session: [] }], summary: "Save a draft; 422 if a rule is broken (editor, admin)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old }, '422': { description: invalid_draft } } }, delete: { security: [{ session: [] }], summary: "Discard an open draft (editor, admin)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old } } } }
  /admin/revisions/{id}/submit: { post: { security: [{ session: [] }], summary: "Send for review (editor, admin)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old } } } }
  /admin/revisions/{id}/approve: { post: { security: [{ session: [] }], summary: "Publish; 409 when stale (admin only)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old }, '409': { description: stale_revision or not in review } } } }
  /admin/revisions/{id}/reject: { post: { security: [{ session: [] }], summary: "Reject with a comment (admin only)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old } } } }
  /admin/audit: { get: { security: [{ session: [] }], summary: "Audit log with filters and paging (editor, admin)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old } } } }
  /admin/gaps: { get: { security: [{ session: [] }], summary: "Links-only levels, missing QS positions, stale records (editor, admin)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old } } } }
  /admin/check: { get: { security: [{ session: [] }], summary: "Batch checker over the stored catalogue (editor, admin)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old } } } }
  /admin/export: { get: { security: [{ session: [] }], summary: "JSON or CSV export (type, format) (editor, admin)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old } } } }
  /admin/users: { get: { security: [{ session: [] }], summary: "Users, roles and AI use (admin only)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old } } } }
  /admin/users/{id}/role: { patch: { security: [{ session: [] }], summary: "Change a role; not your own (admin only)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old } } } }
  /admin/users/{id}/ai: { patch: { security: [{ session: [] }], summary: "Suspend or restore AI for one user (admin only)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old } } } }
  /admin/ai/usage: { get: { security: [{ session: [] }], summary: "AI cost and usage per day, task, user; monthly budget (admin only)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old } } } }
  /admin/demo-snapshots: { post: { security: [{ session: [] }], summary: "Save a real AI result as a demo snapshot (admin only)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old } } } }
  /admin/demo-snapshots/{id}: { delete: { security: [{ session: [] }], summary: "Delete a demo snapshot (admin only)", responses: { '200': { description: ok }, '401': { description: not signed in }, '403': { description: wrong role or sign-in too old } } } }
  /demo-snapshots: { get: { summary: Saved demo analyses (public read), responses: { '200': { description: ok } } } }
  /demo-snapshots/{id}: { get: { summary: One saved analysis, labelled saved with its date, responses: { '200': { description: ok } } } }
  /me/calendar.ics: { get: { security: [{ session: [] }], summary: "Download .ics (confirmed open deadlines of saved universities, plan tasks, own dates; all-day events)", responses: { '200': { description: text/calendar } } } }
  /me/calendar: { get: { security: [{ session: [] }], summary: Feed status and upcoming items, responses: { '200': { description: ok } } } }
  /me/calendar/token: { post: { security: [{ session: [] }], summary: "Create or replace the secret feed URL (token shown once, only a hash is stored)", responses: { '201': { description: url } } }, delete: { security: [{ session: [] }], summary: Revoke the feed URL, responses: { '204': { description: revoked } } } }
  /calendar/{token}.ics: { get: { summary: "Public calendar feed for whoever holds the secret token", parameters: [{ name: token, in: path, required: true, schema: { type: string } }], responses: { '200': { description: text/calendar }, '404': { description: unknown or revoked } } } }
  /me/telegram: { get: { security: [{ session: [] }], summary: Link state, responses: { '200': { description: ok } } }, put: { security: [{ session: [] }], summary: Turn reminders on or off, responses: { '200': { description: ok }, '409': { description: not linked } } }, delete: { security: [{ session: [] }], summary: Unlink, responses: { '204': { description: unlinked } } } }
  /me/telegram/link-code: { post: { security: [{ session: [] }], summary: "One-time code, valid 10 minutes", responses: { '201': { description: code and deep link }, '503': { description: bot not configured } } } }
  /me/reminders: { get: { security: [{ session: [] }], summary: Scheduled reminders, responses: { '200': { description: ok } } } }
  /telegram/webhook: { post: { summary: "Telegram updates; the X-Telegram-Bot-Api-Secret-Token header must match TELEGRAM_WEBHOOK_SECRET", responses: { '200': { description: ok }, '401': { description: bad secret }, '503': { description: webhook disabled } } } }
  /admin/recheck/runs: { get: { security: [{ session: [] }], summary: "Recent recheck runs (editor, admin)", responses: { '200': { description: ok } } } }
  /admin/recheck/run: { post: { security: [{ session: [] }], summary: "Queue a run for the worker (admin only; one at a time)", responses: { '202': { description: queued }, '409': { description: a run is already queued or running } } } }
  /admin/recheck/findings: { get: { security: [{ session: [] }], summary: "Open findings: changed, broken, moved, blocked (editor, admin)", responses: { '200': { description: ok } } } }
  /admin/recheck/findings/{id}/accept: { post: { security: [{ session: [] }], summary: "Open a DRAFT for the record (admin only); changes no published value", responses: { '200': { description: revision id } } } }
  /admin/recheck/findings/{id}/dismiss: { post: { security: [{ session: [] }], summary: "Dismiss a finding (admin only)", responses: { '200': { description: ok } } } }
  /admin/recheck/manual: { get: { security: [{ session: [] }], summary: "Links that refuse automation (editor, admin)", responses: { '200': { description: ok } } } }
  /admin/recheck/manual/checked: { post: { security: [{ session: [] }], summary: "Record that a person checked a blocked link", responses: { '200': { description: ok } } } }
  /metrics: { get: { summary: "Prometheus metrics; Bearer METRICS_TOKEN; 404 when unset; blocked at the proxy", responses: { '200': { description: text/plain }, '404': { description: off or wrong token } } } }
