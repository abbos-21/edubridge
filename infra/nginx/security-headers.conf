# Included by every location (nginx forgets inherited add_header lines when a location sets its own).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.telegram.org; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src https://oauth.telegram.org; form-action 'self' https://oauth.telegram.org https://accounts.google.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
