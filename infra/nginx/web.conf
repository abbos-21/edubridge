# Inside the "web" container: serves the built web app and forwards /api to the API container.
# TLS and HSTS are done by the nginx on the server (see infra/nginx/host-site.conf.example).
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 13m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Metrics are for an internal scraper only (api:8787), never the public internet.
    location ^~ /api/v1/metrics {
        return 404;
    }

    location /api/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # the nginx on the server already set the real client address; pass it on unchanged
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_buffering off;          # the AI advisor streams its answer word by word
        proxy_read_timeout 120s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The Telegram login page has its own, looser policy (the widget needs eval); it can only be framed by this site.
    location = /telegram-login.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://telegram.org 'unsafe-eval'; style-src 'unsafe-inline'; img-src https://*.telegram.org data:; frame-src https://oauth.telegram.org; connect-src https://oauth.telegram.org https://telegram.org; base-uri 'none'; frame-ancestors 'self'" always;
    }
    location = /telegram-login.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
