# Production stack: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# See docs/PRODUCTION.md. Secrets come from .env.production on the server, never from images.
name: edubridge

x-api: &api
  build: { context: ., dockerfile: apps/api/Dockerfile }
  env_file: .env.production
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://edubridge:${POSTGRES_PASSWORD}@postgres:5432/edubridge?schema=public
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edubridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: edubridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edubridge"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *api
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *api
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/api/v1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *api
    command: ["npx", "tsx", "scripts/worker.ts"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    build: { context: ., dockerfile: infra/caddy.Dockerfile }
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS, for example example.org}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  backup:
    build: { context: infra/backup }
    environment:
      PGHOST: postgres
      PGUSER: edubridge
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: edubridge
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET:-}
    volumes:
      - backups:/backups
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backups:
